name: Build MR33 AP image

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mr33-imagebuilder-${{ github.workflow }}
  cancel-in-progress: false

env:
  OPENWRT_VERSION: '24.10.8'
  TARGET: ipq40xx
  SUBTARGET: generic
  ARCH: arm_cortex-a7_neon-vfpv4
  PROFILE: meraki_mr33
  # Use ImageBuilder's standard first-boot service-disable mechanism.
  # dnsmasq and odhcpd are excluded from the package set entirely.
  DISABLED_SERVICES: firewall usteer
  # In OpenWrt 24.10.8, luci-ssl depends on luci-light, which pulls
  # luci-app-firewall and luci-proto-ppp. Those runtime dependencies cannot
  # be removed without dropping LuCI HTTPS; the firewall init script is
  # disabled through ImageBuilder's standard DISABLED_SERVICES mechanism.
  PACKAGES: >-
    luci-ssl luci-i18n-base-zh-cn wpad-basic-mbedtls usteer luci-app-usteer
    -dnsmasq -odhcpd-ipv6only
    -kmod-usb-core -kmod-usb-dwc3 -kmod-usb-dwc3-qcom
    -kmod-usb-xhci-hcd -kmod-usb3
  IMAGEBUILDER: openwrt-imagebuilder-24.10.8-ipq40xx-generic.Linux-x86_64.tar.zst
  BASE_URL: https://downloads.openwrt.org/releases/24.10.8/targets/ipq40xx/generic

jobs:
  build:
    name: Build MR33 AP candidate
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download official metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mr33-input"
          cd "$RUNNER_TEMP/mr33-input"

          curl --fail --location --retry 3 --retry-delay 2 \
            --output sha256sums \
            "$BASE_URL/sha256sums"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output profiles.json \
            "$BASE_URL/profiles.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("profiles.json").read_text())
          profile = metadata["profiles"].get(os.environ["PROFILE"])
          if profile is None:
              raise SystemExit(f"profile not found: {os.environ['PROFILE']}")

          if metadata["target"] != f"{os.environ['TARGET']}/{os.environ['SUBTARGET']}":
              raise SystemExit(f"unexpected target: {metadata['target']}")

          print(f"OpenWrt version: {metadata['version_number']}")
          print(f"Target: {metadata['target']}")
          print(f"Profile: {os.environ['PROFILE']}")
          print(f"Supported devices: {', '.join(profile['supported_devices'])}")
          print(f"Official device packages: {', '.join(profile.get('device_packages', []))}")
          PY

      - name: Download and verify official ImageBuilder
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mr33-input"

          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$IMAGEBUILDER" \
            "$BASE_URL/$IMAGEBUILDER"

          expected_sha256="$(awk -v file="*$IMAGEBUILDER" '$2 == file { print $1 }' sha256sums)"
          if [[ -z "$expected_sha256" ]]; then
              echo "ImageBuilder checksum not found in sha256sums" >&2
              exit 1
          fi

          printf '%s  %s\n' "$expected_sha256" "$IMAGEBUILDER" | sha256sum --check --strict

      - name: Build AP candidate with local customization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mr33-imagebuilder"
          tar --zstd --extract --file "$RUNNER_TEMP/mr33-input/$IMAGEBUILDER" \
            --directory "$RUNNER_TEMP/mr33-imagebuilder"

          imagebuilder_root="$(find "$RUNNER_TEMP/mr33-imagebuilder" -mindepth 1 -maxdepth 1 -type d -name 'openwrt-imagebuilder-*' -print -quit)"
          if [[ -z "$imagebuilder_root" ]]; then
              echo "Unable to locate extracted ImageBuilder directory" >&2
              exit 1
          fi

          make -C "$imagebuilder_root" image \
            PROFILE="$PROFILE" \
            PACKAGES="$PACKAGES" \
            DISABLED_SERVICES="$DISABLED_SERVICES" \
            FILES="$GITHUB_WORKSPACE/files"

          output_dir="$imagebuilder_root/bin/targets/$TARGET/$SUBTARGET"
          mkdir -p "$RUNNER_TEMP/mr33-release"
          cp -a "$output_dir/." "$RUNNER_TEMP/mr33-release/"
          cp "$RUNNER_TEMP/mr33-input/profiles.json" "$RUNNER_TEMP/mr33-release/"
          cp "$RUNNER_TEMP/mr33-input/sha256sums" "$RUNNER_TEMP/mr33-release/official-sha256sums"

      - name: Verify AP candidate output
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/mr33-release"
          sysupgrade="$release_dir/openwrt-$OPENWRT_VERSION-$TARGET-$SUBTARGET-$PROFILE-squashfs-sysupgrade.bin"
          manifest="$release_dir/openwrt-$OPENWRT_VERSION-$TARGET-$SUBTARGET-$PROFILE.manifest"

          test -s "$sysupgrade"
          test -s "$manifest"

          generated_sha256="$(sha256sum "$sysupgrade" | awk '{print $1}')"
          printf '%s  %s\n' "$generated_sha256" "$(basename "$sysupgrade")" \
            > "$release_dir/generated-sha256sums"
          (
            cd "$release_dir"
            sha256sum --check --strict generated-sha256sums
          )

          forbidden_patterns=(
            '^dnsmasq'
            '^odhcpd'
            '^kmod-.*usb'
          )
          for pattern in "${forbidden_patterns[@]}"; do
            if grep -Eq "$pattern" "$manifest"; then
              echo "Forbidden package matched manifest pattern: $pattern" >&2
              grep -En "$pattern" "$manifest" >&2
              exit 1
            fi
          done

          required_patterns=(
            '^wpad-basic-mbedtls '
            '^luci-ssl '
            '^luci-i18n-base-zh-cn '
            '^usteer '
            '^luci-app-usteer '
            '^(ath10k-|kmod-ath10k)'
          )
          for pattern in "${required_patterns[@]}"; do
            if ! grep -Eq "$pattern" "$manifest"; then
              echo "Required package pattern missing from manifest: $pattern" >&2
              exit 1
            fi
          done

          echo '--- AP candidate manifest ---'
          cat "$manifest"

      - name: Upload AP candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mr33-openwrt-${{ env.OPENWRT_VERSION }}-ap-candidate
          path: ${{ runner.temp }}/mr33-release
          if-no-files-found: error
          retention-days: 30

      - name: Publish AP candidate release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="MR33_AP_${OPENWRT_VERSION}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MR33 OpenWrt ${OPENWRT_VERSION} AP candidate" \
            --notes "Cisco Meraki MR33 wired-backhaul AP candidate built from the official OpenWrt ImageBuilder. Wi-Fi is disabled on first boot, LAN uses DHCP client mode, and the upstream MT3000 remains the DHCP/DNS authority." \
            "$RUNNER_TEMP/mr33-release/openwrt-${OPENWRT_VERSION}-${TARGET}-${SUBTARGET}-${PROFILE}-squashfs-sysupgrade.bin" \
            "$RUNNER_TEMP/mr33-release/openwrt-${OPENWRT_VERSION}-${TARGET}-${SUBTARGET}-${PROFILE}.manifest" \
            "$RUNNER_TEMP/mr33-release/generated-sha256sums"
